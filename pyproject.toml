[project]
name = "medanon"
version = "0.1.0"
description = "Small DICOM de-identification API used as a DevOps lab"
requires-python = ">=3.13"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
