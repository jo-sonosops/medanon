# CI: lint and test every push and pull request. On main, also build the image,
# scan it, and push it to GHCR. Deploys are a separate, manual workflow.
#
# Third-party actions are pinned to full commit SHAs, not tags. Tags can be
# moved: in March 2026 an attacker force-pushed most trivy-action tags to
# credential-stealing code (CVE-2026-33634). A SHA cannot be repointed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: pytest -q

  alert-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROM_VERSION: "3.15.0"
      # From the official sha256sums.txt of the v3.15.0 release.
      PROM_SHA256: "2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install promtool (checksum verified)
        run: |
          f="prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          curl -sSfLO "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/${f}"
          echo "${PROM_SHA256}  ${f}" | sha256sum -c -
          tar xzf "$f" --strip-components=1 "prometheus-${PROM_VERSION}.linux-amd64/promtool"

      - name: Check and unit-test alert rules
        working-directory: nixos
        run: |
          ../promtool check rules medanon-alerts.yml
          ../promtool test rules medanon-alerts.test.yml

  image:
    needs: [test, alert-rules]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build image (load locally, do not push yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (fail on fixable HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          FIRST_TAG: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          for tag in $TAGS; do docker push "$tag"; done
          {
            echo "### Image pushed"
            echo "Deploy it with the **deploy** workflow, tag: \`${FIRST_TAG##*:}\`"
          } >> "$GITHUB_STEP_SUMMARY"
